<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Name - Full Stack Developer | Portfolio</title>
    <meta
      name="description"
      content="Portfolio of Your Name, a passionate Full Stack Developer specializing in React, Node.js, and modern web technologies."
    />
    <meta
      name="keywords"
      content="Full Stack Developer, React, Node.js, JavaScript, Portfolio, Web Developer"
    />
    <meta name="author" content="Your Name" />
    <meta property="og:title" content="Your Name - Full Stack Developer" />
    <meta
      property="og:description"
      content="Portfolio showcasing my skills, projects, and experience in web development."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Apply initial theme before React loads to prevent flash of wrong theme
      (function () {
        const savedTheme = localStorage.getItem("theme");
        const prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)"
        ).matches;
        const initialTheme = savedTheme || (prefersDark ? "dark" : "light");

        document.documentElement.classList.add(initialTheme);
      })();
    </script>
  </body>
</html>
